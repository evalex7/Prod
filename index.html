<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EEF3F0;--card:#fff;--ink:#17302B;--mute:#5C726C;--line:#D3DEDA;--acc:#0E7566;--on:#fff;--bad:#B3402F;color-scheme:light}

select,input[type=text],input:not([type]),input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:40px;min-width:0}

:root{--tint:#E3F0EC;--bg:#F2F6F4;--line:#DCE5E1}

body{font-size:15px;padding-bottom:92px}

.row{gap:6px;margin:4px 0 12px}

.sws{display:flex;gap:9px}
.swc{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.sw.acc span{background:color-mix(in srgb,var(--mute) 40%,transparent)}
.sw.acc span:after{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw.acc input:checked+span{background:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const U=['г','кг','мл','л','шт','ст. л.','ч. л.','зубч.'];
const uid=()=>Math.random().toString(36).slice(2,9);
const I=(n,a,u,p)=>({n,a,u,on:true,p:p===undefined?n:p});
const CAT={'М’ясо і риба':['Курячі стегна','Куряче філе','Свинина','Фарш','Риба'],
'Овочі':['Картопля','Морква','Цибуля','Часник','Болгарський перець','Помідори','Капуста'],
'Бакалія':['Рис','Гречка','Макарони','Томатний соус','Олія','Сіль і спеції'],
'Молочне й яйця':['Молоко','Сметана','Сир','Яйця','Масло']};
function seed(){
 const items=[];for(const c in CAT)CAT[c].forEach(n=>items.push({id:uid(),name:n,cat:c,buy:false,got:false,note:'',o:items.length}));
 return{tab:'p',cur:'r1',only:false,edit:false,cf:null,items,recipes:[
 {id:'r1',name:'Курячі стегна з овочами',k:1,note:'Орієнтовно: режим «Тушкування», 50–60 хв. Звірте з вашою книгою.',ing:[I('Курячі стегна',800,'г'),I('Картопля',600,'г'),I('Морква',150,'г'),I('Болгарський перець',150,'г'),I('Цибуля',100,'г'),I('Томатний соус',100,'г'),I('Олія',2,'ст. л.'),I('Сіль і спеції',2,'ч. л.'),I('Вода',100,'мл','')]},
 {id:'r2',name:'Плов з куркою',k:1,note:'Орієнтовно: режим «Плов», близько години. Звірте з вашою книгою.',ing:[I('Рис',300,'г'),I('Курячі стегна',500,'г'),I('Морква',200,'г'),I('Цибуля',150,'г'),I('Часник',4,'зубч.'),I('Олія',4,'ст. л.'),I('Сіль і спеції',2,'ч. л.'),I('Вода',600,'мл','')]},
 {id:'r3',name:'Гречка зі свининою',k:1,note:'Орієнтовно: режим «Гречка» або «Тушкування». Звірте з вашою книгою.',ing:[I('Гречка',250,'г'),I('Свинина',400,'г'),I('Цибуля',100,'г'),I('Морква',100,'г'),I('Олія',2,'ст. л.'),I('Сіль і спеції',1,'ч. л.'),I('Вода',500,'мл','')]}]};
}
let S;try{S=JSON.parse(localStorage.getItem('mv1'))}catch(e){}
if(!S||!S.recipes)S=seed();
const ST={
r1:'Стегна обсушіть, посоліть і присипте спеціями.\nКартоплю наріжте кубиками, моркву — півколами, перець — смужками, цибулю — півкільцями.\nУ чашу влийте олію, викладіть цибулю й моркву та обсмажте 5–7 хв, помішуючи.\nДодайте стегна й обсмажте з обох боків ще кілька хвилин.\nВикладіть картоплю та перець, посоліть, влийте томатний соус, розведений водою.\nЗакрийте кришку й тушкуйте 50–60 хв. Перед подачею залиште на підігріві 10 хв.',
r2:'Рис промийте до прозорої води. Моркву наріжте соломкою, цибулю — півкільцями.\nУ чашу влийте олію й обсмажте стегна 8–10 хв до золотистої скоринки.\nДодайте цибулю та моркву, смажте ще 5 хв.\nВсипте спеції й сіль, додайте зубчики часнику цілими.\nРівним шаром викладіть рис, не перемішуючи, і обережно залийте гарячою водою.\nЗакрийте кришку й готуйте на режимі «Плов» (близько години). Наприкінці перемішайте й залиште на підігріві 10 хв.',
r3:'Свинину наріжте невеликими шматками, цибулю — дрібно, моркву натріть.\nУ чашу влийте олію й обсмажте м’ясо 10 хв, помішуючи.\nДодайте цибулю з морквою, смажте ще 5–7 хв.\nГречку переберіть, промийте й висипте до м’яса, посоліть.\nЗалийте водою, перемішайте й закрийте кришку.\nГотуйте на режимі «Гречка» або «Тушкування» до сигналу, потім залиште на підігріві 10 хв.'};
S.recipes.forEach(r=>{if(r.steps===undefined)r.steps=ST[r.id]||''});
S.items.forEach((i,n)=>{if(i.o===undefined)i.o=n});
S.set=Object.assign({th:'auto',ac:0,fs:1,vib:1,wl:0,hs:1,nt:1},S.set);
if(!S.sp)S.sp=[{id:'s1',n:'Лавровий лист',d:['суп','м’ясо']},{id:'s2',n:'Чорний перець',d:['м’ясо','суп','риба','салат']},{id:'s3',n:'Паприка',d:['м’ясо','птиця','суп']},{id:'s4',n:'Кріп',d:['суп','риба','салат']},{id:'s5',n:'Базилік',d:['салат','соуси']},{id:'s6',n:'Куркума',d:['птиця','гарнір']}];
const save=()=>{try{localStorage.setItem('mv1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=x=>x>=10?Math.round(x):Math.round(x*10)/10;
const K=k=>String(Math.round(k*100)/100).replace('.',',');
const cur=()=>S.recipes.find(r=>r.id===S.cur)||S.recipes[0];
const sp=it=>{window.SYNC&&SYNC.put(it)},sd=id=>{window.SYNC&&SYNC.del(id)};
const nxt=()=>Math.max(0,...S.items.map(i=>i.o||0))+1;
const gen=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(12));return[...r].map(x=>a[x%a.length]).join('')};
const norm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const live=()=>!!(window.SYNC&&SYNC.on);
const NEW={'Напої':['Вода','Сік','Чай','Кава','Газований напій'],
'Випічка і хліб':['Хліб','Батон','Булочки','Лаваш','Печиво'],
'Солодощі':['Цукерки','Шоколад','Морозиво','Мед','Варення'],
'Промислові товари':['Засіб для посуду','Пральний порошок','Туалетний папір','Серветки','Пакети для сміття']};
function mig(a,rem){if((S.v||0)>=2)return a;
 if(!(rem&&a.some(i=>/^d\d+_\d+$/.test(i.id)))){let o=Math.max(0,...a.map(i=>i.o||0));
  Object.keys(NEW).forEach((c,ci)=>NEW[c].forEach((n,ni)=>{const id='d'+ci+'_'+ni;if(!a.some(i=>i.id===id)){const it={id,name:n,cat:c,buy:false,got:false,note:'',o:++o};a.push(it);if(rem)sp(it)}}))}
 S.v=2;return a}
if(!S.code){S.items=mig(S.items,false);save()}
function setFam(c){S.code=c;S.err=null;S.v=0;if(window.SYNC)SYNC.start(c)}
window.getItems=()=>S.items;
let hold=false;
window.onRemote=(a,pend,first)=>{a=mig(a,true);a.sort((x,y)=>(x.o||0)-(y.o||0));if(!pend&&!first&&S.set.nt)notify(S.items,a);S.items=a;S.err=null;save();const f=document.activeElement;if(f&&['ap','ac','fc'].includes(f.id))hold=true;else if(S.tab==='p'||S.tab==='t')render()};
